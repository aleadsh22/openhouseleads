<!DOCTYPE html>
<html>
<head>
<title>Agent Dashboard</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:40px;
}

.card{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    box-sizing:border-box;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.section{
    margin-top:30px;
}
</style>

</head>

<body>

<div class="card">

<h1>Agent Dashboard</h1>

<p>Welcome Realtor</p>

<div class="section">
<h3>Current Open House</h3>

<input
type="text"
placeholder="123 Main Street, Salinas CA">

<button>
Start Open House
</button>
</div>

<div class="section">
<h3>Your Permanent QR Code</h3>

<p>
Same QR code for every property.
</p>

<button>
Generate QR
</button>
</div>

<div class="section">
<h3>Leads</h3>

<button>
View Leads
</button>
</div>

</div>

</body>
</html>
