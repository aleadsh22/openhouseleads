<!DOCTYPE html>
<html>

<head>
    <title>Request Access - OpenHouseLeads</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f5f5;
            padding:50px;
        }

        .card{
            max-width:600px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:12px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }
    </style>

</head>

<body>

<div class="card">

<h1>Request Access</h1>

<p>
Tell us about yourself and we'll set up your OpenHouseLeads account.
</p>

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="text" placeholder="Phone Number">

<input type="text" placeholder="Brokerage">

<button>
Request Access
</button>

</div>

</body>

</html>
