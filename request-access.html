<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Access</title>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;

header{

    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

.card{
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    box-sizing:border-box;
}

.button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:14px 24px;
    font-weight:bold;
    cursor:pointer;
}

.back{
    display:block;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
}

.success{
    margin-top:20px;
    color:green;
    font-weight:bold;
}

required>
