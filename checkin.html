<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Open House Check In</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f8;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

.card{
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

input, select{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    box-sizing:border-box;
}

.button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    padding:14px 24px;
    font-weight:bold;
    cursor:pointer;
}

.success{
    margin-top:20px;
    color:green;
    font-weight:bold;
}

</style>

</head>

<body>

<header>
OpenHouseLeads
</header>

<div class="container">

<div class="card">

<h1>Open House Registration</h1>

<p>
Please sign in before touring the property.
</p>

<input
type="text"
placeholder="Full Name">

<input
type="email"
placeholder="Email">

<input
type="text"
placeholder="Phone Number">

<select>
<option>Working With An Agent?</option>
<option>Yes</option>
<option>No</option>
</select>

<button class="button" onclick="signIn()">
Sign In
</button>

<div id="success" class="success"></div>

</div>

</div>

<script>

function signIn(){

document.getElementById("success").innerHTML =
"Thank you. You are signed in.";

}

</script>

</body>
</html>
